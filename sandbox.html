<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DART Foamer sandbox</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/sandbox/sandbox.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <aside id="panel">
      <h1>Foamer sandbox</h1>
      <p class="note">Greybox stand-ins for each roster role. Shapes, sizes and movement are for discussion; names, looks and colours are Paul's.</p>
      <div class="row" id="modes">
        <button data-mode="lineup" class="on">Lineup</button>
        <button data-mode="roam">Roam</button>
      </div>
      <ul id="roster"></ul>
      <section id="info"></section>
      <div class="controls">
        <label>Speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" /><span id="speedOut">1.00x</span></label>
        <div class="row">
          <button id="play">Pause</button>
          <button id="smooth" class="on">Smooth</button>
          <button id="partLabels">Part labels</button>
        </div>
      </div>
      <p class="hint">Drag to orbit, scroll to zoom, right-drag to pan. The tall clear figure is you (1.8 m).</p>
    </aside>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
