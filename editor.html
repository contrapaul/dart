<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DART level editor</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="editor-ui">
      <div id="topbar">
        <button id="newBtn" type="button">New</button>
        <button id="openBtn" type="button">Open</button>
        <input id="levelName" type="text" value="[Paul]" title="Level name" />
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
        <button id="exportBtn" type="button">Export</button>
        <button id="importBtn" type="button">Import</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden />
        <button id="assetsBtn" type="button" title="Save what is selected as an asset, and place a saved asset">Assets</button>
        <select id="rotateSnap" title="Rotation snap: degrees the rotate handle and snapPrim snap to, remembered">
          <option value="0">Snap off</option>
          <option value="1">1 deg</option>
          <option value="5">5 deg</option>
          <option value="15">15 deg</option>
          <option value="45">45 deg</option>
          <option value="90">90 deg</option>
        </select>
        <button id="importModelBtn" type="button" title="Import a .glb model, kept in the level file">Import model</button>
        <input id="importModelFile" type="file" accept=".glb,model/gltf-binary" hidden />
        <span class="spacer"></span>
        <button id="playBtn" type="button" title="Play the level here (Tab). Shift+Tab plays from the camera. Esc comes back."><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z" fill="currentColor" /></svg> Play</button>
        <span class="spacer"></span>
        <button id="problemsBtn" type="button" title="Run the level's validator">Problems</button>
        <button id="hiddenBtn" type="button" title="Hide the things that start hidden, to see the level as it begins">Hidden things</button>
        <button id="helpBtn" type="button" title="Keys, blockers, the Arena button, keys and doors, hazards, saving">Help</button>
        <span class="counts" id="counts"></span>
        <span class="spacer"></span>
        <span id="status">Loading</span>
      </div>
      <div id="outliner">
        <h2>Level</h2>
        <div id="outlinerList"></div>
      </div>
      <div id="inspector"></div>
      <div id="palette"></div>
      <div id="toolHint" hidden></div>
      <div id="handleBar" role="toolbar" aria-label="Handles" hidden></div>
    </div>
    <div id="dialogs" hidden><div class="panel" id="dialogBody"></div></div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
