<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DART: the Pit</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/arena/arena.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="banner" hidden><span id="bannerText"></span></div>
    <div id="overlay">
      <h1>DART</h1>
      <p id="status">Loading</p>
      <p class="menu">
        <button id="makeLevel" type="button">Make a level</button>
        <button id="playLevel" type="button">Play a level</button>
      </p>
      <button id="titleSettings" type="button">Settings</button>
      <p class="links"><a href="/index.html">Test course</a></p>
    </div>
    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="lockmarker"></div>
      <div id="finishprompt"></div>
      <div id="ammo"></div>
      <div id="pickupflash"></div>
      <div id="vacpip"><i></i></div>
      <div id="health"><div class="bar"><i></i></div><span class="num"></span></div>
      <div id="meleepips"></div>
    </div>
    <div id="hitflash"></div>
    <div id="healflash"></div>
    <div id="complete" hidden>
      <div class="panel">
        <h2>Level complete</h2>
        <!-- LVL-05 stage 2: the campaign's panel names the level and the
             time, and offers Next level and Main menu. The test page keeps
             Play again and these stay hidden. -->
        <p id="completeName" class="level" hidden></p>
        <p id="completeTime" class="time" hidden></p>
        <p id="actEnd" hidden>This act ends here for now.</p>
        <div class="choices">
          <button id="nextLevel" type="button" hidden>Next level</button>
          <button id="mainMenu" type="button" hidden>Main menu</button>
          <button id="playAgain" type="button">Play again</button>
        </div>
      </div>
    </div>
    <div id="popped" hidden>
      <h2>You popped!</h2>
      <button id="tryAgain" type="button">Try again</button>
    </div>
    <div id="pausemenu" hidden>
      <div class="panel">
        <h2>Paused</h2>
        <button id="resumeBtn" type="button">Resume</button>
        <button id="settingsBtn" type="button">Settings</button>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>
    <div id="settings" hidden>
      <div class="panel">
        <h2>Settings</h2>
        <div id="settingsRows"></div>
        <button id="settingsBack" type="button">Back</button>
      </div>
    </div>
    <div id="myLevels" hidden>
      <div class="panel">
        <h2>My levels</h2>
        <p id="myLevelsEmpty" class="empty" hidden>No levels yet. Make a level first.</p>
        <p id="myLevelsError" class="error" hidden></p>
        <div id="myLevelsList"></div>
        <div id="myLevelsProblems" class="problems" hidden></div>
        <button id="openLevelFile" type="button">Open a level file</button>
        <input id="myLevelFile" type="file" accept=".json,application/json" hidden />
        <button id="myLevelsBack" type="button">Back</button>
      </div>
    </div>
    <script type="module" src="/src/arena/main.ts"></script>
  </body>
</html>
