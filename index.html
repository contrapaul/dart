<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DART</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay">
      <h1>DART</h1>
      <p id="status">Loading</p>
      <!-- LVL-05 stage 2: the title's two ways into the campaign. Continue
           only shows when a save exists; New game forgets it. The title
           itself is [Paul]'s. -->
      <p class="menu">
        <button id="newGame" type="button">New game</button>
        <button id="continueGame" type="button" hidden>Continue</button>
      </p>
      <button id="titleSettings" type="button">Settings</button>
      <p class="links"><a href="/arena.html">The Pit</a></p>
    </div>
    <div id="hud" hidden>
      <div id="crosshair"></div>
      <div id="lockmarker"></div>
      <div id="finishprompt"></div>
      <div id="ammo"></div>
      <div id="pickupflash"></div>
      <div id="vacpip"><i></i></div>
      <div id="health"><div class="bar"><i></i></div><span class="num"></span></div>
      <div id="meleepips"></div>
    </div>
    <div id="hitflash"></div>
    <div id="healflash"></div>
    <div id="popped" hidden>
      <h2>You popped!</h2>
      <button id="tryAgain" type="button">Try again</button>
    </div>
    <div id="pausemenu" hidden>
      <div class="panel">
        <h2>Paused</h2>
        <button id="resumeBtn" type="button">Resume</button>
        <button id="settingsBtn" type="button">Settings</button>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>
    <div id="settings" hidden>
      <div class="panel">
        <h2>Settings</h2>
        <div id="settingsRows"></div>
        <button id="settingsBack" type="button">Back</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
